name: Verify Human Identity
on: [workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Clawhub CLI
        run: npm install -g @clawhub/cli

      - name: Clone Skill Repository
        run: git clone https://github.com/BillionsNetwork/verified-agent-identity.git temp-skill

      - name: Install Verified Agent Identity
        run: |
          echo "Menjalankan instalasi dari folder lokal..."
          cd temp-skill && npx @clawhub/cli install . --force

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: node scripts/manualLinkHumanToAgent.js --challenge '{"name":"Reki120","description":"Reki120 AI Agent"}'
