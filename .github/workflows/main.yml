name: Verify Human Identity
on: [workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Diperbarui ke v22 untuk mengatasi EBADENGINE

      - name: Install Skill using Alternative
        run: npx skills add BillionsNetwork/verified-agent-identity --force
      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js
      - name: Link Human to Agent
        run: node scripts/manualLinkHumanToAgent.js --challenge '{"name":"Reki120","description":"Reki120 AI Agent"}'
